name: Gerar APK do Cliente

# ============================================================
#  APP DO CLIENTE - DOCERIA
#  Este arquivo cria o app inteiro e compila o APK sozinho.
#  Caminho no GitHub: .github/workflows/apk-cliente.yml
#  Preencha os dados do Firebase logo abaixo (veja o passo a passo).
# ============================================================

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # --- COLE AQUI OS DADOS DO SEU FIREBASE ---
      FB_API_KEY: "COLE_AQUI"
      FB_AUTH_DOMAIN: "SEU-PROJETO.firebaseapp.com"
      FB_PROJECT_ID: "SEU-PROJETO"
      FB_STORAGE_BUCKET: "SEU-PROJETO.appspot.com"
      FB_SENDER_ID: "000000000000"
      FB_APP_ID: "COLE_AQUI"
      # --- NOME E IDENTIFICADOR DO APP ---
      APP_NAME: "Doceria"
      APP_ID: "com.doceria.cliente"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar o app do cliente
        run: |
          mkdir -p app/www
          cd app
          cat > package.json <<'EOF'
          {
            "name": "doceria-cliente",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/android": "6.1.2"
            }
          }
          EOF
          cat > capacitor.config.json <<EOF
          {"appId": "$APP_ID", "appName": "$APP_NAME", "webDir": "www"}
          EOF
          cat > www/firebase-config.js <<EOF
          window.FIREBASE_CONFIG = {
            apiKey: "$FB_API_KEY",
            authDomain: "$FB_AUTH_DOMAIN",
            projectId: "$FB_PROJECT_ID",
            storageBucket: "$FB_STORAGE_BUCKET",
            messagingSenderId: "$FB_SENDER_ID",
            appId: "$FB_APP_ID"
          };
          EOF
          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#c81d55">
          <title>Doceria</title>
          <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
          <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
          <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
          <script src="firebase-config.js"></script>
          <style>
          :root{--bg:#fff4f7;--card:#fff;--ink:#2b1033;--mut:#7b6285;--pri:#e0245e;--pt:#fff;--line:#f6d9e3;--nav:rgba(255,255,255,.88);--ok:#2f9e63}
          @media(prefers-color-scheme:dark){:root{--bg:#1d0f24;--card:#2b1836;--ink:#fbeaf3;--mut:#bda3c9;--pri:#ff5c8a;--pt:#25061a;--line:#43294f;--nav:rgba(43,24,54,.88);--ok:#6fcf93}}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",system-ui,sans-serif}
          h1,h2,h3{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;margin:0;font-weight:600}
          button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
          #hero{position:relative;overflow:hidden;color:#fff;padding:calc(env(safe-area-inset-top) + 34px) 22px 46px;border-radius:0 0 40px 40px;background:linear-gradient(140deg,#c81d55,#ee4c7c 55%,#f48a6a)}
          #hero h1{font-size:44px;line-height:1.05;letter-spacing:-.5px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;text-shadow:0 3px 18px rgba(80,0,30,.25)}
          #hero p{margin:8px 0 0;opacity:.92;max-width:300px;animation:fade .8s .25s both}
          .hin{position:relative;z-index:1}
          .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:drift 9s ease-in-out infinite alternate}
          .b1{width:190px;height:190px;right:-50px;top:-40px;background:#ffd166}
          .b2{width:120px;height:120px;right:80px;bottom:-50px;background:#a78bfa;animation-delay:-3s}
          .b3{width:70px;height:70px;left:46%;top:24px;background:#9fd8a8;animation-delay:-6s}
          .tick{overflow:hidden;margin:-22px 16px 0;position:relative;z-index:2;background:var(--card);border-radius:16px 16px 16px 4px;box-shadow:0 10px 26px -14px rgba(200,29,85,.6);font-weight:700;font-size:14px;color:var(--pri)}
          .track{display:flex;width:max-content;animation:scroll 22s linear infinite}
          .track span{padding:11px 24px;white-space:nowrap}
          main{padding:20px 16px 170px;max-width:560px;margin:0 auto}
          .chips{display:flex;gap:8px;margin-bottom:14px}
          .chip{padding:9px 16px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px;transition:.25s}
          .chip.on{background:var(--pri);color:var(--pt);border-color:var(--pri);transform:scale(1.04)}
          .item{display:flex;gap:14px;background:var(--card);border-radius:28px 28px 28px 10px;padding:12px;margin-bottom:14px;box-shadow:0 14px 28px -16px hsl(var(--h) 75% 45%/.55)}
          .thumb{position:relative;flex:none;width:92px;height:92px;border-radius:22px 22px 22px 8px;display:grid;place-items:center;font-size:44px;background:hsl(var(--h) 90% 90%)}
          @media(prefers-color-scheme:dark){.thumb{background:hsl(var(--h) 35% 28%)}}
          .thumb span{display:block;animation:float 3.4s ease-in-out infinite}
          .ribbon{position:absolute;left:-6px;top:8px;background:var(--pri);color:var(--pt);font-size:11px;padding:3px 9px;border-radius:0 99px 99px 0;animation:pulse 1.8s infinite}
          .info{flex:1;min-width:0;display:flex;flex-direction:column}
          .info h3{font-size:18px;line-height:1.15}
          .info p{margin:3px 0 0;color:var(--mut);font-size:14px;line-height:1.3}
          .foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
          .price{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:20px;color:var(--pri)}
          .price s{font-size:13px;color:var(--mut);font-weight:500;margin-right:6px}
          .qty{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:99px;padding:3px}
          .qty button{width:34px;height:34px;border-radius:50%;font-size:20px;font-weight:700;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .15s}
          .qty button:active{transform:scale(.85)}
          .qty button[data-p]{background:var(--pri);color:var(--pt)}
          .qty output{min-width:20px;text-align:center;font-weight:700}
          .qty output.bump{animation:bump .3s}
          .qty.z>button:first-child,.qty.z>output{display:none}
          .news{position:relative;overflow:hidden;border-radius:26px 26px 8px 26px;padding:18px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 75% 52%),hsl(calc(var(--h) + 40) 80% 62%))}
          .news h3{font-size:20px}.news p{margin:6px 0 0;opacity:.95}
          .news .spark{position:absolute;right:12px;top:6px;font-size:34px;opacity:.55;animation:float 3s infinite}
          .date{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:24px;padding:12px 14px;margin-bottom:12px}
          .dt{flex:none;width:62px;height:68px;border-radius:18px 18px 18px 6px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
          .dt b{font:600 26px/1 Fredoka,system-ui,sans-serif;color:var(--pri)}.dt span{font-size:12px;color:var(--mut);font-weight:700}
          .date h3{font-size:17px}.date p{margin:2px 0 0;font-size:13px;color:var(--mut)}
          .date em{display:inline-block;margin-top:4px;font-style:normal;font-size:12px;font-weight:700;color:var(--pri)}
          .date.next{background:var(--pri);color:var(--pt);animation:pulse 2.4s infinite}
          .date.next .dt{background:rgba(255,255,255,.22)}.date.next .dt b,.date.next .dt span,.date.next p,.date.next em{color:var(--pt)}
          .date.past{opacity:.5}
          .empty{text-align:center;padding:44px 20px;color:var(--mut)}
          .empty .big{font-size:64px;animation:float 3s ease-in-out infinite}.empty b{display:block;color:var(--ink);font:600 20px Fredoka,system-ui,sans-serif;margin-top:6px}
          .line{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:10px 14px;margin-bottom:10px}
          .total{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 8px;font:600 22px Fredoka,system-ui,sans-serif}.total span:last-child{color:var(--pri)}
          .form{background:var(--card);border-radius:28px 28px 10px 28px;padding:16px}
          label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 4px}
          input,textarea{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit;outline:none;transition:.2s}
          input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
          .shake{animation:shake .4s}
          .cta{width:100%;margin-top:16px;padding:15px;border-radius:18px;background:linear-gradient(135deg,#c81d55,#f06a6a);color:#fff;font:600 18px Fredoka,system-ui,sans-serif;box-shadow:0 12px 24px -10px rgba(200,29,85,.7);transition:transform .15s}
          .cta:active{transform:scale(.97)}.cta:disabled{opacity:.7}
          .err{color:var(--pri);font-weight:700;min-height:22px;margin-top:8px;font-size:14px}
          .ok{text-align:center;padding:40px 10px}
          .ok svg{width:110px;height:110px}.ok circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:290;stroke-dashoffset:290;animation:draw .7s forwards}
          .ok path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .6s forwards}
          .ok h2{font-size:26px;margin-top:10px}.ok p{color:var(--mut)}
          nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:460px;display:flex;justify-content:space-between;padding:7px;border-radius:30px;background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 34px -10px rgba(60,0,40,.4)}
          nav button{position:relative;display:flex;align-items:center;gap:6px;padding:11px 14px;border-radius:24px;font-weight:700;font-size:14px;color:var(--mut);transition:all .35s cubic-bezier(.3,1.2,.4,1)}
          nav button i{font-style:normal;font-size:20px}nav button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .35s}
          nav button.on{background:var(--pri);color:var(--pt)}nav button.on span{max-width:90px}
          .badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;display:grid;place-items:center;padding:0 5px}
          nav button.on .badge{background:#fff;color:var(--pri)}
          #bar{position:fixed;z-index:19;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));width:calc(100% - 44px);max-width:420px;display:flex;justify-content:space-between;padding:14px 20px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);transform:translate(-50%,160%);opacity:0;pointer-events:none;transition:all .45s cubic-bezier(.3,1.3,.4,1)}
          #bar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
          .enter>*{animation:rise .55s var(--d,0ms) both cubic-bezier(.2,.8,.2,1)}
          .cf{position:fixed;top:-12px;z-index:50;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards;pointer-events:none}
          @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}}
          @keyframes pop{from{opacity:0;transform:scale(.7) translateY(10px)}}
          @keyframes fade{from{opacity:0}}
          @keyframes drift{to{transform:translate(-30px,24px) scale(1.15)}}
          @keyframes scroll{to{transform:translateX(-50%)}}
          @keyframes float{50%{transform:translateY(-6px) rotate(-4deg)}}
          @keyframes pulse{50%{transform:scale(1.04)}}
          @keyframes bump{40%{transform:scale(1.5)}}
          @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
          @keyframes draw{to{stroke-dashoffset:0}}
          @keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
          @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
          </style>
          </head>
          <body>
          <header id="hero"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><div class="hin"><h1 id="nm">Doceria</h1><p>Escolha seus doces favoritos e faça seu pedido em poucos toques.</p></div></header>
          <div id="tk"></div>
          <main id="app"></main>
          <button id="bar" data-t="cart"><span id="bc"></span><span id="bt"></span></button>
          <nav id="nav"></nav>
          <script>
          const $=s=>document.querySelector(s);
          const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
          const money=n=>"R$ "+(Number(n)||0).toFixed(2).replace(".",",");
          const eff=i=>Number(i.promo)>0?Number(i.promo):Number(i.price)||0;
          const DEF={name:"Doceria",notice:"",items:[],news:[],dates:[]};
          const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
          const EMO=[[/brigad|trufa|chocol|brownie|nutella|cacau/i,"🍫"],[/bolo|cake|fatia|pote/i,"🍰"],[/torta|pie|lim[aã]o/i,"🥧"],[/cupcake|muffin/i,"🧁"],[/sorvete|gelad|picol/i,"🍨"],[/cookie|biscoit|bolach/i,"🍪"],[/donut|rosquinha|sonho/i,"🍩"],[/morango|fruta/i,"🍓"],[/caf[eé]|capuc/i,"☕"],[/pudim|flan|mouse|mousse/i,"🍮"],[/beijinho|coco/i,"🥥"],[/doce|bombom|caramelo/i,"🍬"]];
          const emo=n=>{for(const[r,e]of EMO)if(r.test(n))return e;return"🧁"};
          const hue=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return h};
          const vib=()=>navigator.vibrate&&navigator.vibrate(10);
          let cfg={...DEF},loaded=false,tab="menu",cart={},sent=false,onlyPromo=false;
          firebase.initializeApp(FIREBASE_CONFIG);const db=firebase.firestore();
          const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
          const total=()=>cfg.items.reduce((s,i)=>s+(cart[i.id]||0)*eff(i),0);
          const empty=(e,t,s)=>`<div class="empty"><div class="big">${e}</div><b>${t}</b><p>${s}</p></div>`;
          const qty=i=>`<div class="qty ${cart[i.id]?"":"z"}" data-q="${i.id}"><button data-m="${i.id}" aria-label="Tirar um">−</button><output>${cart[i.id]||0}</output><button data-p="${i.id}" aria-label="Adicionar um">+</button></div>`;
          function item(i,k){const p=Number(i.promo)>0;return `<article class="item" style="--h:${hue(i.name)};--d:${k*70}ms"><div class="thumb"><span>${emo(i.name)}</span>${p?'<b class="ribbon">promo</b>':""}</div><div class="info"><h3>${esc(i.name)}</h3><p>${esc(i.desc)}</p><div class="foot"><div class="price">${p?`<s>${money(i.price)}</s>`:""}${money(eff(i))}</div>${qty(i)}</div></div></article>`}
          function vMenu(){const v=cfg.items.filter(i=>i.on!==false);if(!v.length)return empty("🍰","O cardápio está sendo preparado","Volte daqui a pouco para ver nossos doces.");
          const pr=v.filter(i=>Number(i.promo)>0),list=onlyPromo?pr:v;
          return `<div class="chips"><button class="chip ${onlyPromo?"":"on"}" data-chip="all">Todos</button><button class="chip ${onlyPromo?"on":""}" data-chip="promo">🔥 Promoções${pr.length?" ("+pr.length+")":""}</button></div>`+(list.length?list.map(item).join(""):empty("🏷️","Nenhuma promoção agora","Veja o cardápio completo."))}
          function vNews(){if(!cfg.news.length)return empty("📣","Nenhuma novidade ainda","Assim que tiver sabor novo, você vê aqui.");
          return cfg.news.slice().reverse().map((n,k)=>`<article class="news" style="--h:${hue(n.title)};--d:${k*70}ms"><span class="spark">✨</span><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></article>`).join("")}
          const days=d=>Math.round((new Date(d+"T00:00:00")-new Date(new Date().toDateString()))/864e5);
          function vDates(){if(!cfg.dates.length)return empty("🎈","Nenhuma data cadastrada","As datas comemorativas aparecem aqui.");
          const L=cfg.dates.slice().sort((a,b)=>a.date<b.date?-1:1),nx=L.findIndex(d=>days(d.date)>=0);
          return L.map((d,k)=>{const n=days(d.date),p=(d.date||"0000-00-00").split("-"),lb=n<0?"já passou":n===0?"é hoje!":n===1?"é amanhã":`faltam ${n} dias`;
          return `<div class="date ${k===nx?"next":""} ${n<0?"past":""}" style="--d:${k*70}ms"><div class="dt"><b>${p[2]}</b><span>${MES[+p[1]-1]||""}</span></div><div><h3>${esc(d.title)}</h3><p>${d.kind==="comem"?"🎈 Data comemorativa":"⭐ Data especial"}${d.note?" · "+esc(d.note):""}</p><em>${lb}</em></div></div>`}).join("")}
          function vCart(){if(sent)return `<div class="ok"><svg viewBox="0 0 110 110"><circle cx="55" cy="55" r="46"/><path d="M34 57l15 15 28-31"/></svg><h2>Pedido enviado!</h2><p>Recebemos seu pedido e vamos entrar em contato em breve.</p><button class="cta" id="again">Fazer outro pedido</button></div>`;
          const L=cfg.items.filter(i=>cart[i.id]);if(!L.length)return empty("🛍️","Seu pedido está vazio","Escolha seus doces no cardápio.");
          return L.map((i,k)=>`<div class="line" style="--d:${k*60}ms"><span>${emo(i.name)} <b>${esc(i.name)}</b><br><small style="color:var(--mut)">${money(eff(i))} cada</small></span>${qty(i)}</div>`).join("")+`<div class="total" style="--d:200ms"><span>Total</span><span>${money(total())}</span></div><div class="form" style="--d:260ms"><label for="cn">Seu nome</label><input id="cn" autocomplete="name"><label for="cp">Telefone com DDD</label><input id="cp" type="tel" autocomplete="tel"><label for="co">Observações (retirada, data, recado)</label><textarea id="co" rows="2"></textarea><div class="err" id="err"></div><button class="cta" id="send">Enviar pedido</button></div>`}
          function nav(){const T=[["menu","🍰","Cardápio"],["news","✨","Novidades"],["dates","🎈","Datas"],["cart","🛍️","Pedido"]];
          $("#nav").innerHTML=T.map(x=>`<button data-t="${x[0]}" class="${tab===x[0]?"on":""}" aria-label="${x[2]}"><i>${x[1]}</i><span>${x[2]}</span>${x[0]==="cart"&&count()?`<b class="badge">${count()}</b>`:""}</button>`).join("");}
          function render(anim){$("#nm").textContent=cfg.name||"Doceria";document.title=cfg.name||"Doceria";
          const t=cfg.notice?`<span>🍬 ${esc(cfg.notice)}</span>`.repeat(6):"";$("#tk").innerHTML=t?`<div class="tick"><div class="track">${t}</div></div>`:"";
          nav();
          const a=$("#app");a.classList.remove("enter");
          a.innerHTML=loaded?{menu:vMenu,news:vNews,dates:vDates,cart:vCart}[tab]():empty("🧁","Preparando os doces…","Só um instante.");
          if(anim){void a.offsetWidth;a.classList.add("enter");scrollTo(0,0)}updBar()}
          function updBar(){const n=count();$("#bar").classList.toggle("show",n>0&&tab!=="cart");$("#bc").textContent="🛍️ Ver pedido ("+n+(n===1?" item)":" itens)");$("#bt").textContent=money(total())}
          function confetti(){const c=["#e0245e","#f4a259","#9fd8a8","#ffd166","#a78bfa"];for(let i=0;i<40;i++){const s=document.createElement("i");s.className="cf";s.style.cssText=`left:${Math.random()*100}vw;background:${c[i%5]};--x:${(Math.random()-.5)*180}px;--r:${Math.random()*720}deg;animation-delay:${Math.random()*.4}s`;document.body.appendChild(s);setTimeout(()=>s.remove(),3000)}}
          document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
          if(d.t){tab=d.t;if(tab!=="cart")sent=false;vib();render(true);return}
          if(d.chip){onlyPromo=d.chip==="promo";render(true);return}
          if(d.p||d.m){const id=d.p||d.m;cart[id]=Math.max(0,(cart[id]||0)+(d.p?1:-1));if(!cart[id])delete cart[id];vib();
          if(tab==="cart"){const k=$("#cn")&&[$("#cn").value,$("#cp").value,$("#co").value];render(false);if(k){$("#cn").value=k[0];$("#cp").value=k[1];$("#co").value=k[2]}return}
          document.querySelectorAll(`[data-q="${id}"]`).forEach(q=>{q.classList.toggle("z",!cart[id]);const o=q.querySelector("output");o.textContent=cart[id]||0;o.classList.remove("bump");void o.offsetWidth;o.classList.add("bump")});
          nav();updBar();return}
          if(b.id==="again"){sent=false;tab="menu";render(true);return}
          if(b.id==="send"){const n=$("#cn").value.trim(),p=$("#cp").value.trim(),er=$("#err");
          const bad=[!n&&$("#cn"),!p&&$("#cp")].filter(Boolean);if(bad.length){er.textContent="Preencha seu nome e telefone para enviar.";bad.forEach(x=>{x.classList.remove("shake");void x.offsetWidth;x.classList.add("shake")});return}
          const lines=cfg.items.filter(i=>cart[i.id]).map(i=>cart[i.id]+"× "+i.name).join(", ");
          b.disabled=true;b.textContent="Enviando…";
          db.collection("orders").add({name:n,phone:p,obs:$("#co").value,lines,total:total(),ts:firebase.firestore.FieldValue.serverTimestamp()}).then(()=>{cart={};sent=true;confetti();render(true)}).catch(()=>{b.disabled=false;b.textContent="Enviar pedido";er.textContent="Não foi possível enviar. Confira sua internet e tente de novo."})}});
          db.doc("config/main").onSnapshot(s=>{const first=!loaded;if(s.exists)cfg={...DEF,...s.data()};loaded=true;
          const f=document.activeElement;if(!first&&f&&/INPUT|TEXTAREA/.test(f.tagName))return;render(first)},()=>{loaded=true;render(true)});
          render(true);
          </script>
          </body>
          </html>
          EOF

      - name: Preparar projeto Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-cliente
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

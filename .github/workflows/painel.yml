name: Gerar APK do Painel

# ============================================================
#  APP DO PAINEL - CHOCOLATES DA MICHELLY
#  Este arquivo cria o app inteiro (com a logo) e compila o APK.
#  Caminho no GitHub: .github/workflows/apk-painel.yml
#  Preencha os dados do Firebase logo abaixo.
# ============================================================

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # --- COLE AQUI OS DADOS DO SEU FIREBASE ---
      FB_API_KEY: "AIzaSyDilFWrT-ZBgQk1EMCBdltzpmN1yv2dpO4"
      FB_AUTH_DOMAIN: "chocolates-da-michelle.firebaseapp.com"
      FB_PROJECT_ID: "chocolates-da-michelle"
      FB_STORAGE_BUCKET: "chocolates-da-michelle.firebasestorage.app"
      FB_SENDER_ID: "34806209865"
      FB_APP_ID: "1:34806209865:web:256f580561aa845e7e8e98"
      # --- NOME E IDENTIFICADOR DO APP ---
      APP_NAME: "Painel Michelly"
      APP_ID: "com.chocolatesmichelly.painel"
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar o app do painel
        run: |
          mkdir -p app/www
          cd app
          cat > package.json <<'EOF'
          {
            "name": "chocolates-michelly-painel",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/android": "6.1.2",
              "@capacitor/local-notifications": "^6.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<EOF
          {"appId": "$APP_ID", "appName": "$APP_NAME", "webDir": "www"}
          EOF
          cat > www/firebase-config.js <<EOF
          window.FIREBASE_CONFIG = {
            apiKey: "$FB_API_KEY",
            authDomain: "$FB_AUTH_DOMAIN",
            projectId: "$FB_PROJECT_ID",
            storageBucket: "$FB_STORAGE_BUCKET",
            messagingSenderId: "$FB_SENDER_ID",
            appId: "$FB_APP_ID"
          };
          EOF
          base64 -d > www/logo.png <<'EOF'

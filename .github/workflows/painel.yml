          cat > www/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#4a2a14">
          <title>Painel</title>
          <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
          <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
          <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
          <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
          <script src="firebase-config.js"></script>
          <style>
          :root{--bg:#fffaf3;--card:#fff;--ink:#3a2314;--mut:#8a6a52;--pri:#7b4f2c;--pt:#fff;--line:#efdcc8;--nav:rgba(255,255,255,.9);--ok:#2f9e63;--pink:#f66fa4}
          @media(prefers-color-scheme:dark){:root{--bg:#211409;--card:#33200f;--ink:#f8ecdd;--mut:#c9ab90;--pri:#e0a96d;--pt:#2a1608;--line:#4a3321;--nav:rgba(51,32,15,.9);--ok:#6fcf93}}
          *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
          body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "DM Sans",system-ui,sans-serif}
          h1,h2,h3{font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif;margin:0;font-weight:600}
          button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
          #hero{position:relative;overflow:hidden;color:#fff;padding:calc(env(safe-area-inset-top) + 34px) 22px 46px;border-radius:0 0 40px 40px;background:linear-gradient(145deg,#4a2a14,#7b4f2c 60%,#a8693a)}
          #hero h1{font-size:32px;line-height:1.08;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;text-shadow:0 3px 18px rgba(80,0,30,.25)}
          #hero p{margin:8px 0 0;opacity:.92;font-size:15px;animation:fade .8s .25s both}
          .hin{position:relative;z-index:1;display:flex;align-items:center;gap:16px}
          .logo{flex:none;width:112px;height:112px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.3),0 14px 30px -8px rgba(0,0,0,.55);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
          .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:drift 9s ease-in-out infinite alternate}
          .b1{width:170px;height:170px;right:-50px;top:-40px;background:#fcb052}
          .b2{width:120px;height:120px;right:80px;bottom:-50px;background:#f66fa4;animation-delay:-3s}
          .b3{width:70px;height:70px;left:46%;top:24px;background:#b9d95a;animation-delay:-6s}
          .b4{width:46px;height:46px;left:12px;bottom:14px;background:#8fd3cf;animation-delay:-2s}
          .tick{overflow:hidden;margin:-22px 16px 0;position:relative;z-index:2;background:var(--card);border-radius:16px 16px 16px 4px;box-shadow:0 10px 26px -14px rgba(74,42,20,.7);font-weight:700;font-size:14px;color:var(--pri)}
          .track{display:flex;width:max-content;animation:scroll 22s linear infinite}
          .track span{padding:11px 24px;white-space:nowrap}
          main{padding:20px 16px 170px;max-width:560px;margin:0 auto}
          .chips{display:flex;gap:8px;margin-bottom:14px}
          .chip{padding:9px 16px;border-radius:99px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:14px;transition:.25s}
          .chip.on{background:var(--pri);color:var(--pt);border-color:var(--pri);transform:scale(1.04)}
          .item{display:flex;gap:14px;background:var(--card);border-radius:28px 28px 28px 10px;padding:12px;margin-bottom:14px;box-shadow:0 14px 28px -16px rgba(74,42,20,.5)}
          .thumb{position:relative;flex:none;width:92px;height:92px;border-radius:22px 22px 22px 8px;display:grid;place-items:center;font-size:44px;background:color-mix(in srgb,var(--c) 42%,var(--card))}
          .thumb span{display:block;animation:float 3.4s ease-in-out infinite}
          .ribbon{position:absolute;left:-6px;top:8px;background:var(--pink);color:#3a2314;font-weight:700;font-size:11px;padding:3px 9px;border-radius:0 99px 99px 0;animation:pulse 1.8s infinite}
          .info{flex:1;min-width:0;display:flex;flex-direction:column}
          .info h3{font-size:18px;line-height:1.15}
          .info p{margin:3px 0 0;color:var(--mut);font-size:14px;line-height:1.3}
          .foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
          .price{font-family:Fredoka,system-ui,sans-serif;font-weight:600;font-size:20px;color:var(--pri)}
          .price s{font-size:13px;color:var(--mut);font-weight:500;margin-right:6px}
          .qty{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:99px;padding:3px}
          .qty button{width:34px;height:34px;border-radius:50%;font-size:20px;font-weight:700;background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12);transition:transform .15s}
          .qty button:active{transform:scale(.85)}
          .qty button[data-p]{background:var(--pri);color:var(--pt)}
          .qty output{min-width:20px;text-align:center;font-weight:700}
          .qty output.bump{animation:bump .3s}
          .qty.z>button:first-child,.qty.z>output{display:none}
          .news{position:relative;overflow:hidden;border-radius:26px 26px 8px 26px;padding:18px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#5a3419,color-mix(in srgb,var(--c) 50%,#7b4f2c))}
          .news h3{font-size:20px}.news p{margin:6px 0 0;opacity:.95}
          .news .spark{position:absolute;right:12px;top:6px;font-size:34px;opacity:.55;animation:float 3s infinite}
          .date{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:24px;padding:12px 14px;margin-bottom:12px}
          .dt{flex:none;width:62px;height:68px;border-radius:18px 18px 18px 6px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center}
          .dt b{font:600 26px/1 Fredoka,system-ui,sans-serif;color:var(--pri)}.dt span{font-size:12px;color:var(--mut);font-weight:700}
          .date h3{font-size:17px}.date p{margin:2px 0 0;font-size:13px;color:var(--mut)}
          .date em{display:inline-block;margin-top:4px;font-style:normal;font-size:12px;font-weight:700;color:var(--pri)}
          .date.next{background:var(--pri);color:var(--pt);animation:pulse 2.4s infinite}
          .date.next .dt{background:rgba(255,255,255,.22)}.date.next .dt b,.date.next .dt span,.date.next p,.date.next em{color:var(--pt)}
          .date.past{opacity:.5}
          .empty{text-align:center;padding:44px 20px;color:var(--mut)}
          .empty .big{font-size:64px;animation:float 3s ease-in-out infinite}.empty b{display:block;color:var(--ink);font:600 20px Fredoka,system-ui,sans-serif;margin-top:6px}
          .line{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:10px 14px;margin-bottom:10px}
          .total{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 8px;font:600 22px Fredoka,system-ui,sans-serif}.total span:last-child{color:var(--pri)}
          .form{background:var(--card);border-radius:28px 28px 10px 28px;padding:16px}
          label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:10px 0 4px}
          input,textarea{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit;outline:none;transition:.2s}
          input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
          .shake{animation:shake .4s}
          .cta{width:100%;margin-top:16px;padding:15px;border-radius:18px;background:linear-gradient(135deg,#5e3a1e,#a8693a);color:#fff;font:600 18px Fredoka,system-ui,sans-serif;box-shadow:0 12px 24px -10px rgba(74,42,20,.7);transition:transform .15s}
          .cta:active{transform:scale(.97)}.cta:disabled{opacity:.7}
          .err{color:#d6336c;font-weight:700;min-height:22px;margin-top:8px;font-size:14px}
          .ok{text-align:center;padding:40px 10px}
          .ok svg{width:110px;height:110px}.ok circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:290;stroke-dashoffset:290;animation:draw .7s forwards}
          .ok path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .6s forwards}
          .ok h2{font-size:26px;margin-top:10px}.ok p{color:var(--mut)}
          nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:460px;display:flex;justify-content:space-between;padding:7px;border-radius:30px;background:var(--nav);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 34px -10px rgba(60,0,40,.4)}
          nav button{position:relative;display:flex;align-items:center;gap:6px;padding:11px 14px;border-radius:24px;font-weight:700;font-size:14px;color:var(--mut);transition:all .35s cubic-bezier(.3,1.2,.4,1)}
          nav button i{font-style:normal;font-size:20px}nav button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .35s}
          nav button.on{background:var(--pri);color:var(--pt)}nav button.on span{max-width:90px}
          .badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:11px;display:grid;place-items:center;padding:0 5px}
          nav button.on .badge{background:#fff;color:var(--pri)}
          #bar{position:fixed;z-index:19;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));width:calc(100% - 44px);max-width:420px;display:flex;justify-content:space-between;padding:14px 20px;border-radius:20px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);transform:translate(-50%,160%);opacity:0;pointer-events:none;transition:all .45s cubic-bezier(.3,1.3,.4,1)}
          #bar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
          .enter>*{animation:rise .55s var(--d,0ms) both cubic-bezier(.2,.8,.2,1)}
          .cf{position:fixed;top:-12px;z-index:50;width:9px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards;pointer-events:none}
          @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}}
          @keyframes pop{from{opacity:0;transform:scale(.7) translateY(10px)}}
          @keyframes fade{from{opacity:0}}
          @keyframes drift{to{transform:translate(-30px,24px) scale(1.15)}}
          @keyframes scroll{to{transform:translateX(-50%)}}
          @keyframes float{50%{transform:translateY(-6px) rotate(-4deg)}}
          @keyframes pulse{50%{transform:scale(1.04)}}
          @keyframes bump{40%{transform:scale(1.5)}}
          @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
          @keyframes draw{to{stroke-dashoffset:0}}
          @keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--r));opacity:.9}}
          @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

          #hero.sm{padding:calc(env(safe-area-inset-top) + 16px) 18px 44px;border-radius:0 0 32px 32px}
          #hero.sm .logo{width:58px;height:58px;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
          #hero.sm h1{font-size:22px}#hero.sm p{margin:2px 0 0;font-size:13px}#hero.sm .hin{gap:12px}
          #hero:not(.sm) .hin{flex-direction:column;text-align:center;gap:14px}#hero:not(.sm) .logo{width:132px;height:132px}#hero:not(.sm) p{max-width:260px}
          main{padding-top:14px}
          .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:-40px 0 16px;position:relative;z-index:2}
          .stat{background:var(--card);border-radius:22px 22px 22px 8px;padding:12px 16px;box-shadow:0 12px 26px -16px rgba(74,42,20,.6)}
          .stat b{display:block;font:600 26px/1.1 Fredoka,system-ui,sans-serif;color:var(--pri)}.stat span{font-size:13px;color:var(--mut)}
          .ord{background:var(--card);border-radius:26px 26px 26px 8px;padding:14px 16px;margin-bottom:12px;border-left:6px solid #fcb052}
          .ord.done{opacity:.6;border-color:var(--ok)}.ord h3{font-size:18px}.ord .meta{font-size:13px;color:var(--mut)}.ord .ln{margin:8px 0 2px}
          .ord .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}.ord .tot{font:600 20px Fredoka,system-ui,sans-serif;color:var(--pri)}
          .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
          .btn{display:inline-block;padding:9px 15px;border-radius:99px;font-weight:700;font-size:14px;text-decoration:none;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);transition:transform .15s}
          .btn:active{transform:scale(.94)}.btn.p{background:var(--pri);color:var(--pt);border-color:var(--pri)}.btn.w{background:#25d366;color:#fff;border-color:#25d366}
          .btn.d{color:#d6336c}.btn.d.c{background:#d6336c;color:#fff;border-color:#d6336c}
          .ed{background:var(--card);border-radius:26px 26px 26px 8px;padding:14px 16px;margin-bottom:14px}
          .edh{display:flex;align-items:center;gap:12px;margin-bottom:4px}
          .edh .thumb{width:52px;height:52px;font-size:26px;border-radius:16px 16px 16px 6px}.edh .grow{flex:1;font-weight:700}
          .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          input[type=checkbox].sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;margin:0;padding:0;border:0;transition:background .25s;flex:none}
          input[type=checkbox].sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.4,.4,1)}
          input[type=checkbox].sw:checked{background:var(--ok)}input[type=checkbox].sw:checked::after{transform:translateX(20px)}
          .add{width:100%;padding:14px;border-radius:22px;border:2px dashed var(--pri);color:var(--pri);font-weight:700;margin-bottom:14px;background:transparent}
          .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-180%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:700;z-index:60;transition:transform .4s cubic-bezier(.3,1.3,.4,1);white-space:nowrap}
          .toast.show{transform:translate(-50%,0)}
          .hint{color:var(--mut);font-size:14px;margin:6px 4px 14px}
          </style>
          </head>
          <body>
          <header id="hero"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i><div class="hin"><img class="logo" src="logo.png" alt="Logo"><div><h1>Painel</h1><p id="hp"></p></div></div></header>
          <main id="app"></main>
          <nav id="nav"></nav>
          <div class="toast" id="toast"></div>
          <script>
          const $=s=>document.querySelector(s);
          const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
          const money=n=>"R$ "+(Number(n)||0).toFixed(2).replace(".",",");
          const uid=()=>Math.random().toString(36).slice(2,9);
          const vib=()=>navigator.vibrate&&navigator.vibrate(12);
          const DEF={name:"Chocolates da Michelly",notice:"",items:[],news:[],dates:[]};
          const EMO=[[/brigad|trufa|chocol|brownie|nutella|cacau/i,"🍫"],[/bolo|cake|fatia|pote/i,"🍰"],[/torta|pie|lim[aã]o/i,"🥧"],[/cupcake|muffin/i,"🧁"],[/sorvete|gelad|picol/i,"🍨"],[/cookie|biscoit|bolach/i,"🍪"],[/donut|rosquinha|sonho/i,"🍩"],[/morango|fruta/i,"🍓"],[/caf[eé]|capuc/i,"☕"],[/pudim|flan|mouse|mousse/i,"🍮"],[/beijinho|coco/i,"🥥"],[/doce|bombom|caramelo/i,"🍬"]];
          const emo=n=>{for(const[r,e]of EMO)if(r.test(n))return e;return"🧁"};
          const PAL=["#f66fa4","#fcb052","#b9d95a","#8fd3cf"];
          const pal=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%997;return PAL[h%4]};
          firebase.initializeApp(FIREBASE_CONFIG);
          const db=firebase.firestore(),auth=firebase.auth(),cfgRef=db.doc("config/main");
          let cfg={...DEF},loaded=false,cfgOk=false,user=null,orders=[],ready=false,tab="orders",unsubO=null,confirmKey=null,loginErr="",tt=null;
          const LN=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.LocalNotifications;
          let notifOn=null;
          async function notifInit(ask){if(!LN){notifOn="web";return}
          try{let p=await LN.checkPermissions();if(p.display!=="granted"&&ask)p=await LN.requestPermissions();notifOn=p.display==="granted";
          if(notifOn)await LN.createChannel({id:"pedidos",name:"Novos pedidos",description:"Aviso de cada pedido feito pelos clientes",importance:5,visibility:1,vibration:true})}catch(e){notifOn=false}
          if(tab==="set"&&!busy())render(false)}
          async function notify(o){if(!LN||notifOn!==true)return false;
          try{await LN.schedule({notifications:[{id:Math.floor(Math.random()*2e9),title:"🔔 Novo pedido!",body:(o.name||"Cliente")+" · "+money(o.total)+(o.lines?"\n"+o.lines:""),channelId:"pedidos"}]});return true}catch(e){return false}}
          const nstat=()=>notifOn==="web"?"Disponível só no app instalado no celular.":notifOn===true?"Ativadas ✓ Você recebe um aviso a cada novo pedido.":notifOn===false?"Desativadas. Toque em Ativar e permita. Se o pedido de permissão não aparecer, ative em Configurações do Android > Apps > Painel Michelly > Notificações.":"Verificando…";
          function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2200)}
          function save(){if(!cfgOk){toast("Cardápio não carregou. Reabra o app.");return}cfgRef.set(cfg).then(()=>toast("Salvo ✓")).catch(()=>toast("Erro ao salvar. Confira a internet."))}
          const busy=()=>{const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
          const empty=(e,t,s)=>`<div class="empty"><div class="big">${e}</div><b>${t}</b><p>${s}</p></div>`;
          const pend=()=>orders.filter(o=>!o.done);
          function vLogin(){return `<div class="form"><label for="le">E-mail</label><input id="le" type="email" autocomplete="username"><label for="lp">Senha</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="err">${esc(loginErr)}</div><button class="cta" id="in">Entrar</button></div>`}
          function vOrders(){const P=pend(),sum=P.reduce((s,o)=>s+(Number(o.total)||0),0);
          let h=`<div class="stats"><div class="stat"><b>${P.length}</b><span>pedidos pendentes</span></div><div class="stat"><b>${money(sum)}</b><span>a receber</span></div></div>`;
          if(!orders.length)return h+empty("🧾","Nenhum pedido ainda","Quando um cliente pedir pelo app, ele aparece aqui na hora.");
          return h+orders.map((o,k)=>{const ph=(o.phone||"").replace(/\D/g,""),wa=ph?`https://wa.me/${ph.length<=11?"55"+ph:ph}?text=${encodeURIComponent("Olá "+o.name+"! Recebi seu pedido: "+o.lines+" — total "+money(o.total))}`:"";
          const dt=o.ts&&o.ts.toDate?o.ts.toDate().toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";const cf=confirmKey==="o"+o.id;
          return `<article class="ord ${o.done?"done":""}" style="--d:${Math.min(k,8)*60}ms"><div class="row"><h3>${esc(o.name)}</h3><span class="tot">${money(o.total)}</span></div><div class="meta">${esc(o.phone)}${dt?" · "+dt:""}${o.done?" · ✅ concluído":""}</div><div class="ln">${esc(o.lines)}</div>${o.obs?`<div class="meta">Obs: ${esc(o.obs)}</div>`:""}<div class="acts">${wa?`<a class="btn w" href="${wa}" target="_blank" rel="noopener">WhatsApp</a>`:""}<button class="btn p" data-done="${o.id}">${o.done?"Reabrir":"Concluir"}</button><button class="btn d ${cf?"c":""}" data-delo="${o.id}">${cf?"Confirmar?":"Excluir"}</button></div></article>`}).join("")}
          const delBtn=(l,id)=>{const cf=confirmKey===l+id;return `<button class="btn d ${cf?"c":""}" data-del="${id}" data-l="${l}">${cf?"Confirmar?":"Remover"}</button>`};
          function vMenu(){return `<button class="add" data-add="items">+ Novo doce</button>`+(cfg.items.length?cfg.items.map((i,k)=>`<div class="ed" data-id="${i.id}" data-l="items" style="--d:${Math.min(k,8)*60}ms"><div class="edh"><div class="thumb" style="--c:${pal(i.name)}"><span>${emo(i.name)}</span></div><div class="grow">${esc(i.name)||"Novo doce"}</div><label style="margin:0;display:flex;align-items:center;gap:8px">Visível <input type="checkbox" class="sw" data-f="on" ${i.on!==false?"checked":""}></label></div><label>Nome</label><input data-f="name" value="${esc(i.name)}"><label>Descrição</label><input data-f="desc" value="${esc(i.desc)}"><div class="g2"><div><label>Preço (R$)</label><input data-f="price" type="number" inputmode="decimal" step="0.01" value="${esc(i.price)}"></div><div><label>Promoção (R$)</label><input data-f="promo" type="number" inputmode="decimal" step="0.01" placeholder="sem promoção" value="${esc(i.promo||"")}"></div></div><div class="acts">${delBtn("items",i.id)}</div></div>`).join(""):empty("🍰","Cardápio vazio","Toque em “Novo doce” para cadastrar o primeiro."))}
          function vNews(){return `<button class="add" data-add="news">+ Nova novidade</button>`+(cfg.news.length?cfg.news.slice().reverse().map((n,k)=>`<div class="ed" data-id="${n.id}" data-l="news" style="--d:${Math.min(k,8)*60}ms"><label>Título</label><input data-f="title" value="${esc(n.title)}"><label>Texto</label><textarea data-f="text" rows="3">${esc(n.text)}</textarea><div class="acts">${delBtn("news",n.id)}</div></div>`).join(""):empty("✨","Sem novidades","Publique um sabor novo ou um aviso para os clientes."))}
          function vDates(){return `<button class="add" data-add="dates">+ Nova data</button>`+(cfg.dates.length?cfg.dates.slice().sort((a,b)=>a.date<b.date?-1:1).map((d,k)=>`<div class="ed" data-id="${d.id}" data-l="dates" style="--d:${Math.min(k,8)*60}ms"><label>Título</label><input data-f="title" value="${esc(d.title)}"><div class="g2"><div><label>Data</label><input data-f="date" type="date" value="${esc(d.date)}"></div><div><label>Tipo</label><select data-f="kind" style="width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:16px;padding:12px;font:inherit;margin:0"><option value="comem" ${d.kind==="comem"?"selected":""}>Comemorativa</option><option value="esp" ${d.kind==="esp"?"selected":""}>Especial da loja</option></select></div></div><label>Observação</label><input data-f="note" value="${esc(d.note||"")}"><div class="acts">${delBtn("dates",d.id)}</div></div>`).join(""):empty("🎈","Nenhuma data","Cadastre datas comemorativas e dias especiais da loja."))}
          function vSet(){return `<div class="ed"><label for="k1">Nome da loja</label><input id="k1" data-k="name" value="${esc(cfg.name)}"><label for="k2">Aviso que rola no topo do app (vazio = sem aviso)</label><input id="k2" data-k="notice" value="${esc(cfg.notice)}"></div><p class="hint">Tudo que você muda aqui aparece no app dos clientes na hora.</p><div class="ed"><h3>🔔 Notificações de pedidos</h3><p class="hint" style="margin:6px 0 0">${nstat()}</p><div class="acts"><button class="btn p" id="nt-ask">Ativar</button><button class="btn" id="nt-test">Testar</button></div><p class="hint" style="margin:10px 0 0">Dica: deixe o painel aberto ou minimizado (não feche deslizando para cima) e, nas configurações do Android, deixe a bateria do app como “Sem restrições”.</p></div><div class="ed"><div class="meta" style="color:var(--mut)">Conectado como<br><b style="color:var(--ink)">${esc(user.email)}</b></div><div class="acts"><button class="btn d" id="out">Sair do painel</button></div></div>`}
          function nav(){if(!user){$("#nav").innerHTML="";$("#nav").style.display="none";return}$("#nav").style.display="flex";const n=pend().length;
          $("#nav").innerHTML=[["orders","🧾","Pedidos"],["menu","🍰","Cardápio"],["news","✨","Novidades"],["dates","🎈","Datas"],["set","⚙️","Ajustes"]].map(x=>`<button data-t="${x[0]}" class="${tab===x[0]?"on":""}" aria-label="${x[2]}"><i>${x[1]}</i><span>${x[2]}</span>${x[0]==="orders"&&n?`<b class="badge">${n}</b>`:""}</button>`).join("")}
          function render(anim){$("#hero").className=user?"sm":"";$("#hp").textContent=user?cfg.name:"Entre para gerenciar pedidos, cardápio e avisos.";nav();
          const a=$("#app");a.classList.remove("enter");
          a.innerHTML=!user?vLogin():!loaded?empty("🧁","Carregando…","Só um instante."):{orders:vOrders,menu:vMenu,news:vNews,dates:vDates,set:vSet}[tab]();
          if(anim){void a.offsetWidth;a.classList.add("enter");scrollTo(0,0)}}
          function newItem(l){const n={id:uid()};if(l==="items"){n.name="Novo doce";n.desc="";n.price=0;n.promo="";n.on=true}if(l==="news"){n.title="Nova novidade";n.text=""}if(l==="dates"){n.title="Nova data";n.date=new Date().toISOString().slice(0,10);n.kind="comem";n.note=""}return n}
          document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;
          if(d.t){tab=d.t;confirmKey=null;vib();render(true);return}
          if(b.id==="in"){const em=$("#le").value.trim(),pw=$("#lp").value;if(!em||!pw){loginErr="Digite seu e-mail e senha.";render(false);return}
          b.disabled=true;b.textContent="Entrando…";auth.signInWithEmailAndPassword(em,pw).catch(()=>{loginErr="E-mail ou senha incorretos.";render(false);const f=$(".form");f.classList.add("shake")});return}
          if(b.id==="nt-ask"){notifInit(true).then(()=>toast(notifOn===true?"Notificações ativadas ✓":"Não foi possível ativar"));return}
          if(b.id==="nt-test"){if(notifOn!==true){toast("Ative as notificações primeiro");return}notify({name:"Cliente de teste",total:0,lines:"Esta é uma notificação de teste"}).then(ok=>toast(ok?"Teste enviado ✓":"Falhou ao enviar"));return}
          if(b.id==="out"){auth.signOut();return}
          if(d.add){const n=newItem(d.add);if(d.add==="news")cfg.news.push(n);else if(d.add==="items")cfg.items.unshift(n);else cfg.dates.push(n);save();vib();render(true);return}
          if(d.del){const k=d.l+d.del;if(confirmKey===k){cfg[d.l]=cfg[d.l].filter(x=>x.id!==d.del);confirmKey=null;save();render(false)}else{confirmKey=k;render(false);setTimeout(()=>{if(confirmKey===k){confirmKey=null;if(!busy())render(false)}},3000)}return}
          if(d.done){const o=orders.find(x=>x.id===d.done);db.collection("orders").doc(d.done).update({done:!o.done}).then(()=>toast(o.done?"Pedido reaberto":"Pedido concluído ✓")).catch(()=>toast("Erro ao atualizar."));vib();return}
          if(d.delo){const k="o"+d.delo;if(confirmKey===k){confirmKey=null;db.collection("orders").doc(d.delo).delete().then(()=>toast("Pedido excluído")).catch(()=>toast("Erro ao excluir."))}else{confirmKey=k;render(false);setTimeout(()=>{if(confirmKey===k){confirmKey=null;if(!busy())render(false)}},3000)}}});
          document.addEventListener("change",e=>{const t=e.target;if(!user||!loaded)return;
          if(t.dataset.k){cfg[t.dataset.k]=t.value;save();return}
          if(t.dataset.f){const c=t.closest("[data-id]"),it=cfg[c.dataset.l].find(x=>x.id===c.dataset.id);if(!it)return;
          it[t.dataset.f]=t.type==="checkbox"?t.checked:(t.type==="number"?(t.value===""?"":Number(t.value)):t.value);save()}});
          cfgRef.onSnapshot(s=>{if(s.exists)cfg={...DEF,...s.data()};cfgOk=true;loaded=true;if(!busy())render(false)},()=>{loaded=true;render(false)});
          auth.onAuthStateChanged(u=>{user=u;loginErr="";if(unsubO){unsubO();unsubO=null}orders=[];ready=false;if(u)notifInit(true);
          if(u)unsubO=db.collection("orders").orderBy("ts","desc").onSnapshot(q=>{if(ready)q.docChanges().forEach(c=>{if(c.type==="added"){toast("🔔 Novo pedido!");vib();notify(c.doc.data())}});orders=q.docs.map(d=>({id:d.id,...d.data()}));ready=true;if(!busy())render(false)},()=>{});
          render(true)});
          render(true);
          </script>
          </body>
          </html>
          EOF

      - name: Preparar projeto Android
        working-directory: app
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Criar o icone do app com a logo
        continue-on-error: true
        working-directory: app
        run: |
          mkdir -p assets
          npm install --no-save sharp
          cat > icons.js <<'EOF'
          const sharp = require("sharp");
          (async () => {
            await sharp("www/logo.png").resize(1024, 1024).toFile("assets/icon-only.png");
            await sharp("www/logo.png").resize(680, 680)
              .extend({ top: 172, bottom: 172, left: 172, right: 172, background: { r: 0, g: 0, b: 0, alpha: 0 } })
              .toFile("assets/icon-foreground.png");
            await sharp({ create: { width: 1024, height: 1024, channels: 3, background: "#ffffff" } })
              .png().toFile("assets/icon-background.png");
          })();
          EOF
          node icons.js
          npx --yes @capacitor/assets generate --android
          npx cap sync android

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-painel
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
